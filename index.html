<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
 :root{--bg:#121212;--panel:#181818;--card:#242424;--text:#eee;--muted:#999;--accent:#1db954;--img:none}
 *{box-sizing:border-box} html,body{margin:0;height:100%}
 body{background:var(--bg) var(--img);color:var(--text);font:14px "Segoe UI",sans-serif;overflow:hidden}
 aside{position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--panel);display:flex;flex-direction:column;padding:14px;gap:8px;border-right:1px solid #0003}
 .logo{font-size:20px;font-weight:800;color:var(--accent);margin:2px 0 6px}
 h3{margin:8px 0 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
 button,select,input{background:var(--card);color:var(--text);border:0;border-radius:10px;padding:9px 10px;font:inherit}
 button{cursor:pointer;text-align:left} button:hover{filter:brightness(1.25)}
 .nav{display:flex;flex-direction:column;gap:2px} .nav button{background:none;padding:8px 10px}
 .pl{display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto}
 .pl div{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
 .pl div:hover,.pl .on{background:var(--card)}
 .pl i{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--card));color:#fff}
 .pl small{color:var(--muted);display:block}
 .row{display:flex;gap:6px} .row>*{flex:1;min-width:0} .row .s{flex:0}
 .add{background:var(--accent);color:#000;font-weight:700;text-align:center}
 #tracks{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
 .t{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:8px;padding:7px 9px}
 .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer} .t span:hover{color:var(--accent)}
 .t b{cursor:pointer;color:var(--muted)} .t b:hover{color:#f55}
 #foot{position:fixed;left:280px;right:0;bottom:0;height:28px;background:var(--panel);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;border-top:1px solid #0003}
 #foot b{color:var(--accent);margin-left:4px}
</style></head><body>
<aside>
 <div class="logo">♫ Music Hub</div>
 <div class="nav">
  <button onclick="api.open('youtube')">▶ YouTube Music</button>
  <button onclick="api.open('yandex')">♪ Яндекс Музыка</button>
  <button onclick="api.open('spotify')">● Spotify</button>
 </div>
 <h3>Плейлисты</h3>
 <div class="pl" id="pl"></div>
 <div class="row"><input id="new" placeholder="Новый плейлист"><button class="s" onclick="create()">＋</button></div>
 <button class="add" onclick="add()">♥ Добавить текущий трек</button>
 <div id="tracks"></div>
 <h3>Тема</h3>
 <div class="row"><select id="theme" onchange="api.setTheme(this.value);paint(this.value)"></select><button class="s" onclick="del()" title="Удалить плейлист">🗑</button></div>
</aside>
<div id="foot">Music Hub <b id="ver"></b></div>
<script>
 let data = {}, cur = 'Избранное', T = {};
 const $ = (id) => document.getElementById(id);
 function paint(k) {
  const t = T[k]; if (!t) return; const s = document.documentElement.style;
  for (const p of ['bg','panel','card','text','muted','accent']) s.setProperty('--' + p, t[p]);
  s.setProperty('--img', t.img || 'none'); $('theme').value = k;
 }
 function render(d) {
  if (d) data = d; if (!data[cur]) cur = 'Избранное';
  $('pl').innerHTML = '';
  for (const n of Object.keys(data)) {
   const el = document.createElement('div'); if (n === cur) el.className = 'on';
   el.innerHTML = '<i></i><div><span></span><small></small></div>';
   el.querySelector('i').textContent = n === 'Избранное' ? '♥' : n[0].toUpperCase();
   el.querySelector('span').textContent = n; el.querySelector('small').textContent = 'Плейлист · ' + data[n].length;
   el.onclick = () => { cur = n; render(); }; $('pl').appendChild(el);
  }
  const box = $('tracks'); box.innerHTML = '';
  data[cur].forEach((t, i) => {
   const el = document.createElement('div'); el.className = 't'; el.innerHTML = '<span></span><b>✕</b>';
   el.firstChild.textContent = t.title || t.url; el.firstChild.onclick = () => api.open(t.url);
   el.lastChild.onclick = async () => render(await api.removeTrack(cur, i)); box.appendChild(el);
  });
 }
 async function add() { render(await api.addCurrent(cur)); }
 async function create() { const i = $('new'), n = i.value.trim(); i.value = ''; if (n) { cur = n; render(await api.create(n)); } }
 async function del() { render(await api.deleteList(cur)); }
 (async () => {
  T = await api.themes();
  $('theme').innerHTML = Object.entries(T).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join('');
  paint(await api.getTheme()); $('ver').textContent = 'v' + await api.version();
  api.onData(render); render(await api.get());
 })();
</script></body></html>
